name: Preview Build

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build preview
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: remodel-preview-${{ github.ref_name }}
          path: dist
          if-no-files-found: error
          retention-days: 7
